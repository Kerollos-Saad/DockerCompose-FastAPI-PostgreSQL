@if (loading()) {
  <p>Loading...</p>
} @else if (error()) {
  <p role="alert">Unable to load todos.</p>
} @else if (todos().length === 0) {
  <p>No todos yet</p>
} @else {
  <ul>
    @for (todo of todos(); track todo.id) {
      <li [class.completed]="todo.completed">{{ todo.title }}</li>
    }
  </ul>
}
